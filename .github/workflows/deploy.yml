name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verify Pages uses GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (data.build_type !== 'workflow') {
              core.setFailed('Open Settings > Pages and set Source to GitHub Actions. Branch publishing serves the README instead of the compiled portfolio.');
            }
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Clear deployment left by branch publishing
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = '96246a18c3c59c536c944a9ab32645883944a664';
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pages_deployment_id: deployment,
              });
              core.info('Cancelled the stale branch-publishing deployment.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            } catch (error) {
              if (![400, 404, 409].includes(error.status)) throw error;
              core.info(`Previous deployment is no longer cancellable (HTTP ${error.status}).`);
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 
